<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nepal Area Unit Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Nepal Area Unit Converter</h1>

  <div class="unit-section">
    <h2>Ropani System</h2>
    <div class="input-row">
      <div class="input-group">
        <label for="ropani">Ropani</label>
        <input type="number" id="ropani" min="0" placeholder="0">
      </div>
      <div class="input-group">
        <label for="aana">Aana</label>
        <input type="number" id="aana" min="0" placeholder="0">
      </div>
      <div class="input-group">
        <label for="paisa">Paisa</label>
        <input type="number" id="paisa" min="0" placeholder="0">
      </div>
      <div class="input-group">
        <label for="daam">Daam</label>
        <input type="number" id="daam" min="0" placeholder="0">
      </div>
    </div>
  </div>

  <div class="unit-section">
    <h2>Bigha System</h2>
    <div class="input-row">
      <div class="input-group">
        <label for="bigha">Bigha</label>
        <input type="number" id="bigha" min="0" placeholder="0">
      </div>
      <div class="input-group">
        <label for="kattha">Kattha</label>
        <input type="number" id="kattha" min="0" placeholder="0">
      </div>
      <div class="input-group">
        <label for="dhur">Dhur</label>
        <input type="number" id="dhur" min="0" placeholder="0">
      </div>
    </div>
  </div>

  <div class="unit-section">
    <h2>Modern System</h2>
    <div class="input-row">
      <div class="input-group">
        <label for="sqmeters">Square Meters</label>
        <input type="number" id="sqmeters" min="0" placeholder="0">
      </div>
      <div class="input-group">
        <label for="sqfeet">Square Feet</label>
        <input type="number" id="sqfeet" min="0" placeholder="0">
      </div>
      <div class="input-group">
        <label for="hectare">Hectare</label>
        <input type="number" id="hectare" min="0" placeholder="0">
      </div>
    </div>
  </div>
<br>
<br>
  <button id="clear-btn">Clear Values Above</button>

  <script src="script.js"></script>
</body>
</html>
